[package]
name = "timekeeper"
version.workspace = true
description = "TimeKeeper v2"
authors = ["Robb"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "timekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
timekeeper-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target."cfg(windows)".dependencies]
windows-registry = "0.100"
windows-result = "0.100"
keyring = "4"

# Linux talks to the Secret Service directly, so each call makes its own D-Bus connection.
[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

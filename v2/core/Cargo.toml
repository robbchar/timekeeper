[package]
name = "timekeeper-core"
version = "0.1.0"
edition = "2021"
description = "TimeKeeper storage, timer and reporting. No GUI dependencies."

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

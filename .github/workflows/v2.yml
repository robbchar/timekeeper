name: v2

on:
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"
  # Runs on main seed the caches that PRs restore from.
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: v2

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain and components pinned in v2/rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: "npm"
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Also produces dist/, which tauri::generate_context! needs at compile time.
      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Core tests
        run: cargo test -p timekeeper-core

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2

      # generate_context! only needs the frontend dir to exist.
      - name: Stub frontend dist
        run: mkdir dist

      - name: cargo check
        run: cargo check -p timekeeper

      - name: Core tests
        run: cargo test -p timekeeper-core

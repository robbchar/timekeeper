name: v2

on:
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"

defaults:
  run:
    working-directory: v2

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Also produces dist/, which tauri::generate_context! needs at compile time.
      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test -- --run

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Core tests
        run: cargo test -p timekeeper-core

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2

      # generate_context! only needs the frontend dir to exist.
      - name: Stub frontend dist
        run: mkdir dist

      - name: cargo check
        run: cargo check -p timekeeper
